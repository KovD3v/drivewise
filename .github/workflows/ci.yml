name: CI

on:
  pull_request:
  push:
    branches:
      - main

# The jobs only read the repository; no step needs to write to it.
permissions:
  contents: read

# Third-party actions are pinned to the commit of a release tag, verified with
# `git ls-remote`; the trailing comment names that tag. To update one, resolve
# the new tag the same way and replace both the SHA and the comment.

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: drivewise_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d drivewise_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drivewise_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drivewise_test
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: apps/api/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Ruff
        run: uv run --frozen --project apps/api --extra dev ruff check apps/api

      - name: Pytest
        run: uv run --frozen --project apps/api --extra dev pytest apps/api -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Vitest runs under Node. Node 25 breaks the jsdom tests through its
      # built-in localStorage, so CI uses the version pinned in .nvmrc.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test:web

      - name: Typecheck
        run: bun run typecheck:web

      - name: Build
        # The production browser bundle calls the API on the same origin (vercel.json).
        env:
          VITE_API_BASE_URL: /api
        run: bun run build:web

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Check generated API types
        run: |
          bun run gen:api-types
          git diff --exit-code apps/web/src/api/schema.gen.ts

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the release's checksums file.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The commit-range scan needs the base commit of the PR or push.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Scan the working tree
        run: gitleaks dir --config .gitleaks.toml --redact --no-banner .

      # History before .gitleaks.toml holds known false positives in old web
      # fixtures, so only the commits this PR or push adds are scanned. That
      # catches a secret committed and then deleted inside the same change.
      - name: Scan the new commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] \
            && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE..$PUSH_AFTER"
          else
            echo "No previous commit to compare with; the tree scan covers this push."
            exit 0
          fi
          gitleaks git --config .gitleaks.toml --redact --no-banner --log-opts="$range" .

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      # Both audits read only the lockfiles and need no token. They report
      # without failing CI because bun.lock and apps/api/uv.lock already carry
      # known advisories (F-30). Remove continue-on-error from a step once its
      # lockfile audits clean, so a new advisory then blocks the merge.
      - name: Audit JavaScript dependencies (bun.lock)
        continue-on-error: true
        run: |
          set +e
          bun audit --audit-level=high > "$RUNNER_TEMP/bun-audit.txt" 2>&1
          status=$?
          cat "$RUNNER_TEMP/bun-audit.txt"
          {
            echo "### bun audit (high and critical)"
            echo '```'
            cat "$RUNNER_TEMP/bun-audit.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Audit Python dependencies (apps/api/uv.lock)
        continue-on-error: true
        run: |
          set +e
          requirements="$RUNNER_TEMP/api-requirements.txt"
          uv export --frozen --project apps/api --all-extras --no-emit-project \
            --format requirements-txt -o "$requirements" || exit 1
          uvx --from pip-audit==2.10.1 pip-audit --strict --disable-pip \
            --require-hashes -r "$requirements" > "$RUNNER_TEMP/pip-audit.txt" 2>&1
          status=$?
          cat "$RUNNER_TEMP/pip-audit.txt"
          {
            echo "### pip-audit (apps/api, all extras)"
            echo '```'
            cat "$RUNNER_TEMP/pip-audit.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
