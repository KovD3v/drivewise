name: Purge expired sessions (GDPR)

on:
  schedule:
    # Daily at 03:17 UTC — runs independently of Vercel plan limits.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Retention period in days (minimum 1)"
        required: false
        default: "30"
        type: string
      dry_run:
        description: "Count expired rows without deleting"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: purge-expired-sessions
  cancel-in-progress: false

jobs:
  purge:
    name: Purge expired anonymous sessions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: apps/api/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Run GDPR retention purge
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DAYS: ${{ inputs.days }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Missing repository secret DATABASE_URL." >&2
            exit 1
          fi

          days="${INPUT_DAYS:-30}"
          args=(--days "$days")
          if [ "$EVENT_NAME" = "schedule" ] || [ "$INPUT_DRY_RUN" = "false" ]; then
            args+=(--execute)
          fi

          uv run --frozen --project apps/api python apps/api/scripts/purge_expired_sessions.py "${args[@]}"
