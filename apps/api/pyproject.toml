[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drivewise-api"
version = "0.1.0"
description = "FastAPI backend for Drivewise."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "psycopg[binary]>=3.2.0",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "jsonschema>=4.23.0",
  "pytest>=8.0.0",
  "ruff>=0.8.0"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"
